name: Windows source checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned test and build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run pure-Python and export regression tests
        run: python -m pytest -q
      - name: Check build entry points
        run: |
          python build_release.py --help
          python build_updater.py --help
          python launcher.py --help
